[project]
name = "introllm-research-helper"
version = "0.1.0"
description = "Multi-agent system for scientific literature: STORM-style research with a verified evidence ledger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_helper"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PT",      # pytest style
    "BLE",     # blind except
    "T20",     # print statements
    "S",       # security (bandit)
]
# RUF001-003: Cyrillic text in strings/comments is intentional (docs and messages are in Russian).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", ".claude/hooks/loop_guard.py"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not network",
    "--cov=research_helper",
    "--cov-report=term-missing",
]
# Hard per-test timeout: a hanging test (e.g. an endless agent loop) fails instead of blocking CI.
timeout = 60
markers = [
    "network: needs network access and API keys; excluded by default and in CI",
]

[tool.coverage.run]
branch = true
source = ["research_helper"]

[tool.coverage.report]
fail_under = 80
show_missing = true
