name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python from .python-version
        run: uv python install

      - name: Install dependencies strictly from uv.lock
        run: uv sync --locked --all-groups

      # Includes tests/tooling: the loop-guard hook is exercised through the exact command
      # from .claude/settings.json and the project .venv created by `uv sync` above.
      - name: Lint, format, types, tests (same as local `make check`)
        run: make check
